        font-weight: 400;
        letter-spacing: 4px;
      }

      /* Hover Tooltip Styling */
      .node-group {
        cursor: pointer;
      }

      .tooltip {
        opacity: 0;
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none;
      }

      .node-group:hover .tooltip {
        opacity: 1;
      }

      .node-group:hover circle.node-bg {
        stroke: #ffffff;
        stroke-width: 2px;
      }

      .tooltip-bg {
        fill: #1a1a1a;
        stroke: #444444;
        stroke-width: 1px;
        rx: 4px;
