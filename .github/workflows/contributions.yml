name: Generate Contributions

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: prences-may-salve-baldeconza
          outputs: |
            dist/contributions.svg?palette=github-dark&color_snake=#ef4444&color_dots=#000000,#3f0a0a,#7f1111,#b91c1c,#ef4444
            dist/contributions-dark.svg?palette=github-dark&color_snake=#ef4444&color_dots=#000000,#3f0a0a,#7f1111,#b91c1c,#ef4444

      - name: Publish generated SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
