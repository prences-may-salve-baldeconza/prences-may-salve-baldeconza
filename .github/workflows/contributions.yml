name: Update Contributions

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        uses: Man0dya/Readme-Contribution-Graph-Generator@main
        with:
          username: prences-may-salve-baldeconza
          output: assets/contributions.svg

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          git diff --cached --quiet || git commit -m "Update contributions"

          git push
